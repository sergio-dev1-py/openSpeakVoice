<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modelos de Whisper</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="window-page">
    <header class="win-header">
      <svg class="bolt" width="14" height="22" viewBox="0 0 13 20" fill="currentColor">
        <path d="M7.9 0.6 1 11.4h3.6L4.4 19.4 12 8.2H7.4L7.9 0.6Z" />
      </svg>
      <h1 id="title">Modelos de Whisper</h1>
    </header>

    <main class="win-body">
      <section class="card">
        <label class="row" style="cursor: pointer">
          <span class="flex-1">
            <span data-i18n="models_gpu">Aceleración por GPU</span><br />
            <span class="hint" data-i18n="models_gpu_hint"></span>
          </span>
          <span class="switch">
            <input type="checkbox" id="use-gpu" />
            <span class="track"></span>
            <span class="thumb"></span>
          </span>
        </label>
      </section>
      <div id="model-list" class="col" style="gap: 8px"></div>
    </main>

    <footer class="win-footer">
      <button class="btn" id="close">Cerrar</button>
    </footer>
    <script type="module" src="/src/models.ts"></script>
  </body>
</html>
