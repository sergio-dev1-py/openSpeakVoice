[package]
name = "voicetotext"
version = "2.0.0"
description = "Voice-to-text pill widget: global hotkey transcription & translation (Groq / local Whisper)"
authors = ["sergio-dev1-py"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "voicetotext_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
cpal = "0.15"
whisper-rs = "0.15.1"
arboard = "3"
enigo = "0.2"
dirs = "5"
thiserror = "2"
futures-util = "0.3"
log = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
