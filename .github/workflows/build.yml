name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            formats: nsis
            llvm_path: C:\Program Files\LLVM\bin
          - os: ubuntu-22.04
            label: linux-x64
            formats: "deb,appimage"
            llvm_path: /usr/lib/llvm-14/lib
          - os: macos-15
            label: macos-arm64
            formats: "app,dmg"
          - os: macos-15-intel
            label: macos-x64
            formats: "app,dmg"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake clang libclang-dev \
            libasound2-dev libudev-dev libxdo-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev \
            libfuse2 patchelf file
          echo "LIBCLANG_PATH=${{ matrix.llvm_path }}" >> "$GITHUB_ENV"

      # cargo-packager downloads the NSIS toolchain it needs, so only LLVM
      # (preinstalled on the Windows runners) has to be exposed to bindgen.
      - name: Configure LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\libclang.dll")) {
            throw "LLVM/libclang not found on the Windows runner"
          }
          "LIBCLANG_PATH=${{ matrix.llvm_path }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install CMake and LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Configure macOS build target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"

      # Apple clang on the arm64 CI runners defines __ARM_FEATURE_MATMUL_INT8
      # even when i8mm is not enabled, which breaks ggml's ARM quant code.
      # Undefine it for the whisper.cpp CMake build (forwarded by whisper-rs-sys).
      - name: Configure whisper.cpp for Apple Silicon
        if: matrix.label == 'macos-arm64'
        shell: bash
        run: |
          echo "CMAKE_C_FLAGS=-U__ARM_FEATURE_MATMUL_INT8" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_FLAGS=-U__ARM_FEATURE_MATMUL_INT8" >> "$GITHUB_ENV"

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Build installers
        working-directory: app/src-tauri
        shell: bash
        run: |
          set -o pipefail
          cargo packager --release --formats ${{ matrix.formats }} 2>&1 | tee packager.log

      - name: Upload packaging log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VoiceToText-packager-log-${{ matrix.label }}
          path: app/src-tauri/packager.log
          if-no-files-found: ignore

      - name: Collect platform assets
        working-directory: app/src-tauri
        shell: bash
        run: |
          set -e
          mkdir -p release-assets
          shopt -s nullglob
          case "${{ runner.os }}" in
            Windows)
              setups=(dist/*-setup.exe)
              test "${#setups[@]}" -gt 0
              cp "${setups[0]}" release-assets/VoiceToText-windows-x64-setup.exe
              ;;
            Linux)
              debs=(dist/*.deb)
              appimages=(dist/*.AppImage)
              test "${#debs[@]}" -gt 0
              test "${#appimages[@]}" -gt 0
              cp "${debs[0]}" release-assets/VoiceToText-linux-x64.deb
              cp "${appimages[0]}" release-assets/VoiceToText-linux-x64.AppImage
              ;;
            macOS)
              dmgs=(dist/*.dmg)
              test "${#dmgs[@]}" -gt 0
              cp "${dmgs[0]}" "release-assets/VoiceToText-${{ matrix.label }}.dmg"
              ;;
          esac
          ls -lh release-assets

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoiceToText-${{ matrix.label }}
          path: app/src-tauri/release-assets/*
          if-no-files-found: error

      - name: Attach installers to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: VoiceToText ${{ github.ref_name }}
          body: |
            ## VoiceToText ${{ github.ref_name }}

            Lightweight Rust + Slint voice-to-text widget.

            ### Installers
            - **Windows:** `VoiceToText-windows-x64-setup.exe`
            - **Linux:** `VoiceToText-linux-x64.deb` / `VoiceToText-linux-x64.AppImage`
            - **macOS:** `VoiceToText-macos-arm64.dmg` / `VoiceToText-macos-x64.dmg`

            The installers are unsigned. Source and build instructions are in the
            [README](https://github.com/sergio-dev1-py/openSpeakVoice#readme).
          files: app/src-tauri/release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
