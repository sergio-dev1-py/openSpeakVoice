name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            binary: app/src-tauri/target/release/voicetotext.exe
            asset: VoiceToText-windows-x64.exe
          - os: ubuntu-22.04
            label: linux-x64
            binary: app/src-tauri/target/release/voicetotext
            asset: VoiceToText-linux-x64
          - os: macos-15
            label: macos-arm64
            binary: app/src-tauri/target/release/voicetotext
            asset: VoiceToText-macos-arm64
          - os: macos-15-intel
            label: macos-x64
            binary: app/src-tauri/target/release/voicetotext
            asset: VoiceToText-macos-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libxdo-dev \
            pkg-config cmake clang libclang-dev
          echo "LIBCLANG_PATH=/usr/lib/llvm-14/lib" >> "$GITHUB_ENV"

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install CMake and LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Build release
        run: cargo build --release --manifest-path app/src-tauri/Cargo.toml

      # The raw Rust binary is called `voicetotext` on every platform, so give
      # each release asset a unique, platform-specific name.
      - name: Package release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceToText-${{ matrix.label }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
